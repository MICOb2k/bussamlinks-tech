<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bussamlinks Technology | Premium Tech & Gadgets</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen pb-24 font-sans selection:bg-blue-600 selection:text-white">

    <!-- Direct Install Banner -->
    <div id="install-banner" class="hidden bg-blue-600 text-white px-4 py-2 text-xs flex justify-between items-center shadow-md">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-mobile-screen text-base animate-pulse"></i>
            <span>Install Bussamlinks App on your phone!</span>
        </div>
        <button id="install-btn" class="bg-white text-blue-700 font-bold px-3 py-1 rounded-lg shadow">Install</button>
    </div>

    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-40 bg-white border-b border-gray-200 px-4 py-2.5 shadow-sm">
        <div class="max-w-md mx-auto space-y-2">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md">
                        <i class="fa-solid fa-bolt-lightning text-sm"></i>
                    </div>
                    <div>
                        <h1 class="font-black text-sm text-blue-700 tracking-tight">Bussamlinks Tech</h1>
                        <p class="text-[9px] text-gray-400 font-bold uppercase">Official Store</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-[9px] font-bold text-gray-400">HOTLINE:</p>
                    <a href="tel:+2348038055199" class="text-[11px] font-black text-blue-600">+234 803 805 5199</a>
                </div>
            </div>
            <!-- Search & Filter -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-xs"></i>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Search power banks, phones, audio..." class="w-full bg-gray-100 border border-gray-200 rounded-full pl-9 pr-4 py-2 text-xs text-gray-800 focus:outline-none focus:bg-white focus:border-blue-600">
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-3 space-y-3">
        
        <!-- SHOP VIEW -->
        <div id="view-shop" class="space-y-3">
            <!-- Category Pills -->
            <div class="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                <button onclick="filterCat('All', this)" class="cat-btn bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap shadow-sm">All Items</button>
                <button onclick="filterCat('Power', this)" class="cat-btn bg-white text-gray-600 px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap border border-gray-200">Power</button>
                <button onclick="filterCat('Phones', this)" class="cat-btn bg-white text-gray-600 px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap border border-gray-200">Phones</button>
                <button onclick="filterCat('Cooling', this)" class="cat-btn bg-white text-gray-600 px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap border border-gray-200">Cooling</button>
                <button onclick="filterCat('Audio', this)" class="cat-btn bg-white text-gray-600 px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap border border-gray-200">Audio</button>
            </div>

            <!-- 2-Column Compact Grid (Sir Busam Preferred Layout) -->
            <div id="product-grid" class="grid grid-cols-2 gap-2.5">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- CART VIEW -->
        <div id="view-cart" class="hidden space-y-3">
            <h2 class="text-sm font-bold text-gray-800 border-b pb-2">Shopping Cart</h2>
            <div id="cart-items" class="space-y-2"></div>
            <div class="bg-white rounded-xl p-3 border border-gray-200 shadow-sm space-y-2">
                <div class="flex justify-between text-xs">
                    <span class="text-gray-500">Subtotal</span>
                    <span id="cart-subtotal" class="font-bold text-gray-900">₦0</span>
                </div>
                <div class="flex justify-between text-[10px] text-emerald-600 font-semibold">
                    <span>Delivery Estimate:</span>
                    <span>2–4 Business Days</span>
                </div>
                <hr class="border-gray-100">
                <div class="space-y-2">
                    <button onclick="openCheckout()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow transition-all text-xs">
                        Normal Checkout (<span id="cart-total">₦0</span>)
                    </button>
                    <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl shadow transition-all text-xs flex items-center justify-center gap-1.5">
                        <i class="fa-brands fa-whatsapp"></i> Order via WhatsApp
                    </button>
                </div>
            </div>
        </div>

        <!-- ACCOUNT VIEW -->
        <div id="view-account" class="hidden space-y-3">
            <div class="bg-white rounded-xl p-5 border border-gray-200 shadow-sm text-center space-y-3" id="account-box">
                <!-- Injected via JS -->
            </div>
        </div>
    </main>

    <!-- CHECKOUT MODAL -->
    <div id="checkout-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 space-y-3 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-xs text-gray-900">Secure Checkout & Payment Verification</h3>
                <button onclick="closeCheckout()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <form onsubmit="submitOrder(event)" class="space-y-2.5 text-xs">
                <div>
                    <label class="block font-bold text-gray-700 mb-0.5">Full Name</label>
                    <input type="text" id="order-name" required placeholder="Enter full name" class="w-full bg-gray-50 border rounded-lg p-2">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-0.5">Email Address</label>
                    <input type="email" id="order-email" required placeholder="name@gmail.com" class="w-full bg-gray-50 border rounded-lg p-2">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-0.5">Phone Number</label>
                    <input type="tel" id="order-phone" required placeholder="08012345678" class="w-full bg-gray-50 border rounded-lg p-2">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-0.5">Delivery Address</label>
                    <textarea id="order-address" required placeholder="Street address, city" class="w-full bg-gray-50 border rounded-lg p-2 h-14"></textarea>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-0.5">Payment Method</label>
                    <select id="order-payment" class="w-full bg-gray-50 border rounded-lg p-2 font-bold text-gray-800">
                        <option value="Direct Bank Transfer">Direct Bank Transfer</option>
                        <option value="Payment on Delivery">Payment on Delivery (POD)</option>
                        <option value="Credit/Debit Card">Credit / Debit Card</option>
                    </select>
                </div>
                <div class="pt-1">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition-all text-xs">
                        Confirm & Submit Order
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- GOOGLE ACCOUNT SELECTOR MODAL -->
    <div id="google-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3 text-center border shadow-xl">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-9 h-9 mx-auto">
            <h3 class="font-bold text-sm text-gray-900">Sign in with Google</h3>
            <p class="text-[11px] text-gray-500">Select an account to sign into Bussamlinks</p>
            <button onclick="selectGoogleAccount('M I C O', 'mico.is.feared@gmail.com')" class="w-full bg-gray-50 hover:bg-gray-100 border p-2.5 rounded-xl flex items-center gap-3 text-left">
                <div class="w-7 h-7 bg-blue-600 text-white font-bold rounded-full flex items-center justify-center text-xs">M</div>
                <div>
                    <p class="text-xs font-bold text-gray-800">M I C O</p>
                    <p class="text-[10px] text-gray-500">mico.is.feared@gmail.com</p>
                </div>
            </button>
            <button onclick="closeGoogleModal()" class="text-[11px] text-gray-400">Cancel</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-gray-200 py-2 px-6 flex justify-around shadow-lg">
        <button onclick="switchTab('shop')" id="nav-shop" class="flex flex-col items-center gap-0.5 text-blue-600 font-bold text-[11px]">
            <i class="fa-solid fa-store text-base"></i><span>Shop</span>
        </button>
        <button onclick="switchTab('cart')" id="nav-cart" class="flex flex-col items-center gap-0.5 text-gray-400 font-bold text-[11px] relative">
            <i class="fa-solid fa-cart-shopping text-base"></i>
            <span id="cart-badge" class="absolute -top-1 right-2 bg-blue-600 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center">0</span>
            <span>Cart</span>
        </button>
        <button onclick="switchTab('account')" id="nav-account" class="flex flex-col items-center gap-0.5 text-gray-400 font-bold text-[11px]">
            <i class="fa-solid fa-user text-base"></i><span>Account</span>
        </button>
    </nav>

    <!-- Script Application Logic -->
    <script>
        const STORE_EMAIL = "bltechnology01@gmail.com";
        const STORE_WHATSAPP = "2348038055199";

        const products = [
            { id: 1, name: "20,000mAh 22.5W Fast Charge Power Bank", category: "Power", price: 18500, oldPrice: 22000, discount: "-15%", image: "https://images.pexels.com/photos/518543/pexels-photo-518543.jpeg?auto=compress&cs=tinysrgb&w=600", stock: "In Stock" },
            { id: 2, name: "Tecno Spark 50 (New Release)", category: "Phones", price: 125000, oldPrice: 145000, discount: "-14%", image: "https://images.pexels.com/photos/404280/pexels-photo-404280.jpeg?auto=compress&cs=tinysrgb&w=600", stock: "In Stock" },
            { id: 3, name: "Dual-Fan RGB Semiconductor Phone Cooler", category: "Cooling", price: 12500, oldPrice: 16000, discount: "-22%", image: "https://images.pexels.com/photos/7915437/pexels-photo-7915437.jpeg?auto=compress&cs=tinysrgb&w=600", stock: "In Stock" },
            { id: 4, name: "Wireless ANC Bluetooth Earbuds", category: "Audio", price: 15000, oldPrice: 19500, discount: "-23%", image: "https://images.pexels.com/photos/3780104/pexels-photo-3780104.jpeg?auto=compress&cs=tinysrgb&w=600", stock: "In Stock" }
        ];

        let cart = JSON.parse(localStorage.getItem('bussam_cart')) || [];
        let currentUser = JSON.parse(localStorage.getItem('bussam_user')) || null;
        let activeCategory = 'All';

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').classList.remove('hidden');
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('install-banner').classList.add('hidden');
                deferredPrompt = null;
            }
        });

        function renderProducts(items) {
            document.getElementById('product-grid').innerHTML = items.map(p => `
                <div class="bg-white rounded-xl border border-gray-200 p-2.5 flex flex-col justify-between shadow-sm relative">
                    <span class="absolute top-2 left-2 bg-red-600 text-white text-[8px] font-black px-1.5 py-0.5 rounded">${p.discount}</span>
                    <div class="h-28 bg-gray-50 rounded-lg overflow-hidden mb-2">
                        <img src="${p.image}" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h3 class="text-[11px] font-bold text-gray-800 line-clamp-2">${p.name}</h3>
                        <div class="flex items-baseline gap-1 mt-1">
                            <span class="text-xs font-black text-gray-900">₦${p.price.toLocaleString()}</span>
                            <span class="text-[9px] text-gray-400 line-through">₦${p.oldPrice.toLocaleString()}</span>
                        </div>
                    </div>
                    <button onclick="addToCart(${p.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-[10px] py-2 rounded-lg mt-2 shadow transition-all">
                        Add To Cart
                    </button>
                </div>
            `).join('');
        }

        function filterCat(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn bg-white text-gray-600 px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap border border-gray-200";
            });
            if(btn) btn.className = "cat-btn bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap shadow-sm";
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchCat = activeCategory === 'All' || p.category === activeCategory;
                const matchQuery = p.name.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });
            renderProducts(filtered);
        }

        function switchTab(tab) {
            ['shop', 'cart', 'account'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex flex-col items-center gap-0.5 text-gray-400 font-bold text-[11px]";
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).className = "flex flex-col items-center gap-0.5 text-blue-600 font-bold text-[11px]";
            if (tab === 'cart') renderCart();
            if (tab === 'account') renderAccount();
        }

        function addToCart(id) {
            const exists = cart.find(c => c.id === id);
            if (exists) exists.qty++;
            else cart.push({ id, qty: 1 });
            localStorage.setItem('bussam_cart', JSON.stringify(cart));
            updateBadge();
            alert("Added to cart!");
        }

        function updateBadge() {
            const total = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cart-badge').innerText = total;
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-xl p-6 text-center text-gray-400 text-xs">Your cart is empty.</div>`;
                document.getElementById('cart-subtotal').innerText = '₦0';
                document.getElementById('cart-total').innerText = '₦0';
                return;
            }
            let subtotal = 0;
            container.innerHTML = cart.map(item => {
                const p = products.find(prod => prod.id === item.id);
                subtotal += p.price * item.qty;
                return `
                    <div class="bg-white rounded-xl border p-2.5 flex items-center justify-between shadow-sm">
                        <div class="flex items-center gap-2.5">
                            <img src="${p.image}" class="w-10 h-10 rounded-lg object-cover">
                            <div>
                                <h4 class="text-[11px] font-bold text-gray-800 line-clamp-1">${p.name}</h4>
                                <p class="text-[11px] font-black text-gray-900">₦${(p.price * item.qty).toLocaleString()}</p>
                            </div>
                        </div>
                        <span class="text-xs font-bold bg-gray-100 px-2 py-0.5 rounded">x${item.qty}</span>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-subtotal').innerText = `₦${subtotal.toLocaleString()}`;
            document.getElementById('cart-total').innerText = `₦${subtotal.toLocaleString()}`;
        }

        function renderAccount() {
            const box = document.getElementById('account-box');
            if (currentUser) {
                box.innerHTML = `
                    <div class="w-12 h-12 bg-blue-600 text-white font-black text-lg rounded-full flex items-center justify-center mx-auto shadow">${currentUser.name.charAt(0)}</div>
                    <div>
                        <h3 class="font-bold text-xs text-gray-900">${currentUser.name}</h3>
                        <p class="text-[10px] text-gray-500">${currentUser.email}</p>
                    </div>
                    <button onclick="logout()" class="w-full bg-gray-100 text-gray-700 text-xs font-bold py-2 rounded-lg">Sign Out</button>
                `;
            } else {
                box.innerHTML = `
                    <h3 class="font-bold text-xs text-gray-900">Welcome to Bussamlinks</h3>
                    <p class="text-[11px] text-gray-500 mb-2">Sign in to sync your orders and wishlist.</p>
                    <button onclick="openGoogleModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-xl shadow">Continue with Google</button>
                `;
            }
        }

        function openGoogleModal() { document.getElementById('google-modal').classList.remove('hidden'); }
        function closeGoogleModal() { document.getElementById('google-modal').classList.add('hidden'); }
        function selectGoogleAccount(name, email) {
            currentUser = { name, email };
            localStorage.setItem('bussam_user', JSON.stringify(currentUser));
            closeGoogleModal();
            renderAccount();
        }
        function logout() {
            currentUser = null;
            localStorage.removeItem('bussam_user');
            renderAccount();
        }

        function openCheckout() {
            if (cart.length === 0) return alert("Cart is empty!");
            if (currentUser) {
                document.getElementById('order-name').value = currentUser.name;
                document.getElementById('order-email').value = currentUser.email;
            }
            document.getElementById('checkout-modal').classList.remove('hidden');
        }
        function closeCheckout() { document.getElementById('checkout-modal').classList.add('hidden'); }

        function submitOrder(e) {
            e.preventDefault();
            const name = document.getElementById('order-name').value;
            const email = document.getElementById('order-email').value;
            const phone = document.getElementById('order-phone').value;
            const address = document.getElementById('order-address').value;
            const payment = document.getElementById('order-payment').value;

            const itemsList = cart.map(c => {
                const p = products.find(prod => prod.id === c.id);
                return `• ${p.name} (x${c.qty}) - ₦${(p.price * c.qty).toLocaleString()}`;
            }).join('\n');

            const total = cart.reduce((sum, c) => sum + (products.find(p => p.id === c.id).price * c.qty), 0);

            const msg = encodeURIComponent(`🚨 NEW ORDER - BUSSAMLINKS TECH 🚨\n\n👤 *Customer:* ${name}\n📧 *Email:* ${email}\n📞 *Phone:* ${phone}\n📍 *Address:* ${address}\n💳 *Payment Method:* ${payment}\n\n📦 *ITEMS:*\n${itemsList}\n\n💰 *TOTAL:* ₦${total.toLocaleString()}\n\n⏳ *Delivery:* 2–4 Business Days`);
            
            const mailtoLink = `mailto:${STORE_EMAIL}?subject=New Order from ${name}&body=${encodeURIComponent(decodeURIComponent(msg))}`;

            cart = [];
            localStorage.removeItem('bussam_cart');
            updateBadge();
            closeCheckout();

            window.open(`https://wa.me/${STORE_WHATSAPP}?text=${msg}`, '_blank');
            window.location.href = mailtoLink;
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert("Cart is empty!");
            const itemsList = cart.map(c => {
                const p = products.find(prod => prod.id === c.id);
                return `• ${p.name} (x${c.qty}) - ₦${(p.price * c.qty).toLocaleString()}`;
            }).join('\n');
            const total = cart.reduce((sum, c) => sum + (products.find(p => p.id === c.id).price * c.qty), 0);
            const msg = encodeURIComponent(`Hello Bussamlinks Technology 👋,\nI want to place an order:\n\n${itemsList}\n\n*Total: ₦${total.toLocaleString()}*`);
            window.open(`https://wa.me/${STORE_WHATSAPP}?text=${msg}`, '_blank');
        }

        renderProducts(products);
        updateBadge();
    </script>
</body>
</html>
